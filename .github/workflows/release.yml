name: Release Obsidian plugin

# DISABLED as an automatic tag trigger since 0.5.0, and this is why: the plugin workspace depends on its two
# sibling packages by local path (packages/obsidian/package.json pins @archivist-gg/core and @archivist-gg/dnd5e
# as file:../../../..), so `npm ci` cannot resolve them on a runner and the build step fails before it can
# produce an asset. Until both packages are published and the dependency is re-pointed at a version range,
# releases are built locally and uploaded with `gh release create`. Run this workflow by hand only when that
# is no longer true.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" == *-* ]]; then
            RELEASE_FLAGS="--prerelease"
          else
            RELEASE_FLAGS="--latest"
          fi
          gh release create "$TAG_NAME" \
            --title="$TAG_NAME" \
            --generate-notes \
            $RELEASE_FLAGS \
            main.js manifest.json styles.css
